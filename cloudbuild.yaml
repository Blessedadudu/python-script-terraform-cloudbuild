steps:
  # Retrieve secrets from Secret Manager and store them in environment variables
  - name: "gcr.io/cloud-builders/gcloud"
    id: "fetch-secrets"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        echo "Fetching secrets..."
        echo "$(gcloud secrets versions access latest --secret=WELCOME_MESSAGE)" > /workspace/WELCOME_MESSAGE
        echo "$(gcloud secrets versions access latest --secret=SLEEP_TIME)" > /workspace/SLEEP_TIME
        echo "$(gcloud secrets versions access latest --secret=PRODUCTION)" > /workspace/PRODUCTION

  # Build the Docker image, injecting secrets as build arguments
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"
      - "--build-arg"
      - "WELCOME_MESSAGE=$(cat /workspace/WELCOME_MESSAGE)"
      - "--build-arg"
      - "SLEEP_TIME=$(cat /workspace/SLEEP_TIME)"
      - "--build-arg"
      - "PRODUCTION=$(cat /workspace/PRODUCTION)"
      - "."

  # Push the Docker image to GCR
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"]

  # Check if the VM exists
  - name: "gcr.io/cloud-builders/gcloud"
    id: "check-vm"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        if gcloud compute instances describe docker-vm-112 --zone=europe-west1-c > /dev/null 2>&1; then
          echo "VM exists"
          exit 0
        else
          echo "VM does not exist"
          exit 1
        fi
    allowFailure: true

  # Run Terraform only if VM doesn't exist
  - name: "hashicorp/terraform:latest"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        terraform init
        terraform apply -auto-approve
    dir: "terraform"
    allowFailure: true

  # Update the VM container to use the new image
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "compute"
      - "instances"
      - "update-container"
      - "docker-vm-112"
      - "--zone=europe-west1-c"
      - "--container-image=gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"

images:
  - "gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"

options:
  logging: CLOUD_LOGGING_ONLY
