steps:
  # Build the Docker image using secrets from Secret Manager
  - name: "gcr.io/cloud-builders/docker"
    secretEnv: ['WELCOME_MESSAGE', 'SLEEP_TIME', 'PRODUCTION']
    args:
      - "build"
      - "-t"
      - "gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"
      - "--build-arg"
      - "WELCOME_MESSAGE=$$WELCOME_MESSAGE"
      - "--build-arg"
      - "SLEEP_TIME=$$SLEEP_TIME"
      - "--build-arg"
      - "PRODUCTION=$$PRODUCTION"
      - "."

  # Push the Docker image to GCR
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"]

  # Check if the VM exists
  - name: "gcr.io/cloud-builders/gcloud"
    id: "check-vm"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        if gcloud compute instances describe docker-vm-112 --zone=europe-west1-c > /dev/null 2>&1; then
          echo "VM exists"
          exit 0
        else
          echo "VM does not exist"
          exit 1
        fi
    allowFailure: true

  # Run Terraform only if VM doesn't exist
  - name: "hashicorp/terraform:latest"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        terraform init
        terraform apply -auto-approve
    dir: "terraform"
    allowFailure: true

  # Update the VM container to use the new image
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "compute"
      - "instances"
      - "update-container"
      - "docker-vm-112"
      - "--zone=europe-west1-c"
      - "--container-image=gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"

availableSecrets:
  secretManager:
  - versionName: projects/singular-agent-452813-n6/secrets/WELCOME_MESSAGE/versions/latest
    env: "WELCOME_MESSAGE"
  - versionName: projects/singular-agent-452813-n6/secrets/SLEEP_TIME/versions/latest
    env: "SLEEP_TIME"
  - versionName: projects/singular-agent-452813-n6/secrets/PRODUCTION/versions/latest
    env: "PRODUCTION"

images:
  - "gcr.io/singular-agent-452813-n6/dockerize-python-script-cicd"

options:
  logging: CLOUD_LOGGING_ONLY
